# AI install hint: choose deps by OS/env + needed ui/bot. do NOT install all.
# minimal core first; missing packages can be installed on demand.

[project]
name = "genericagent"
version = "0.1.0"
description = "Minimalist self-evolving autonomous agent framework"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.12",
    "bottle>=0.12",
    "simple-websocket-server>=0.4",
    "PyYAML>=6",
    "pydantic>=2",
    "psutil>=5.9",
    "urllib3>=1.26",
]

[project.optional-dependencies]
# The supported product surface is `ga` / `ga ink`.  Legacy UI adapters are
# kept in-tree for reference only and are NOT part of the default package
# contract or release dependency set.
mcp = [
    "mcp>=1.0",
    "fastmcp>=2.0",
]
langfuse = [
    "langfuse",
]
# Explicit opt-in only.  These extras are deprecated and are not installed by
# any of the supported GA entry points.
legacy-ui = [
    "streamlit>=1.28",
    "pywebview>=4.0",
    "textual>=0.70",
    "rich>=13",
    "pillow>=10",
]
legacy-qt = [
    "PySide6>=6",
    "markdown>=3.5",
]
legacy-bots = [
    "python-telegram-bot>=20.0",
    "qq-botpy>=1.0",
    "discord.py>=2.0",
    "pycryptodome>=3.19",
    "qrcode>=7.4",
    "lark-oapi>=1.0",
    "wecom-aibot-sdk>=1.0",
    "dingtalk-stream>=0.20",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
packages = [
    "ga_cli",
    "genericagent",
    "genericagent.agents",
    "genericagent.core",
    "genericagent.core.control",
    "genericagent.core.permissions",
    "genericagent.core.tool_results",
    "genericagent.hooks",
    "genericagent.hooks.examples",
    "genericagent.llm",
    "genericagent.llm.templates",
    "genericagent.mcp",
    "genericagent.media",
    "genericagent.resources",
    "genericagent.resources.assets",
    "genericagent.resources.assets.tmwd_cdp_bridge",
    "genericagent.resources.skills",
    "genericagent.resources.skills.workflow-authoring",
    "genericagent.services",
    "genericagent.tools",
    "genericagent.tools.web_fetch",
    "genericagent.web",
    "genericagent.workflow",
    "genericagent.workflow.js",
    "frontends",
    "frontends.acp",
    "frontends.common",
    "frontends.ink",
    "frontends.ink.ui",
    "frontends.ink.ui.src",
    "frontends.terminal",
]

[tool.setuptools.package-data]
"genericagent.workflow" = ["js/*.js"]
"genericagent.resources" = [
    "*.py",
    "llm.yaml.example",
    "assets/*.json",
    "assets/*.txt",
    "assets/tmwd_cdp_bridge/*",
    "skills/workflow-authoring/SKILL.md",
    "skills/workflow-authoring/references/api.md",
    "skills/workflow-authoring/references/artifacts.md",
    "skills/workflow-authoring/references/examples.md",
    "skills/workflow-authoring/references/resume.md",
    "skills/workflow-authoring/references/testing.md",
    "prompts/*",
    "schemas/*",
]
"genericagent.llm.templates" = ["*.py"]
"frontends.ink" = [
    "bridge.py",
    "ui/package.json",
    "ui/package-lock.json",
    "ui/tsconfig.json",
    "ui/src/*.ts",
    "ui/src/*.tsx",
]
"frontends.terminal" = ["continue_cmd.py"]

[project.scripts]
ga = "ga_cli.cli:main"
